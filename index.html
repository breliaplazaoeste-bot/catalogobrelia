<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Blanquería</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#ffffff;
    color:#333;
}

nav{
    display:flex;
    justify-content:center;
    gap:40px;
    padding:20px;
    background:white;
    border-bottom:1px solid #eee;
}

nav a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.hero{
    height:70vh;
    background:#e8e2da;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:3rem;
    margin-bottom:10px;
}

.hero p{
    font-size:1.2rem;
}

.categorias{
    padding:60px 10%;
}

.categorias h2{
    text-align:center;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.card{
    background:#f5f5f5;
    height:250px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    font-weight:bold;
}

</style>

</head>
<body>

<nav>
    <a href="#">Inicio</a>
    <a href="#">Acolchados</a>
    <a href="#">Sábanas</a>
    <a href="#">Edredones</a>
    <a href="#">Toallas</a>
</nav>

<section class="hero">
    <h1>Descubrí nuestra colección</h1>
    <p>Ropa de cama y textiles para el hogar</p>
</section>

<section class="categorias">

<h2>Categorías</h2>

<div class="grid">

<div class="card">Acolchados</div>

<div class="card">Sábanas</div>

<div class="card">Edredones</div>

<div class="card">Toallas</div>

</div>

</section>

</body>
</html>
